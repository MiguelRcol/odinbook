name: Check and test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: odinbook_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/odinbook_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/odinbook_test
      SESSION_SECRET: ci-test-secret-with-more-than-thirty-two-characters
      APP_ORIGIN: http://localhost:3020
      PORT: 3020
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:demo
      - run: npm run format:check
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
