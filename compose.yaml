services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: odinbook
      POSTGRES_PASSWORD: local-compose-only
      POSTGRES_DB: odinbook
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U odinbook']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports: ['3020:3020']
    environment:
      DATABASE_URL: postgresql://odinbook:local-compose-only@db:5432/odinbook
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET to a random string of at least 32 characters}
      APP_ORIGIN: http://localhost:3020
      NODE_ENV: development
      ALLOW_GUEST: 'true'
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
